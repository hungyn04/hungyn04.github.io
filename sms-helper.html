<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>SMS Helper</title>
    <link rel="icon" href="/resources/logo-rounded.png" />
  </head>
  <body>
    <script>
      const queryString = window.location.search;
      const urlParams = new URLSearchParams(queryString);
      const number = urlParams.get("number");
      const name = encodeURIComponent(urlParams.get("name"));
      const content = encodeURIComponent(urlParams.get("content").replace("[name]", name));
      window.location.href = `sms:${number}?body=${content}`;
    </script>
  </body>
</html>
